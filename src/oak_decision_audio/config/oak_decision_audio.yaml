decision_audio_node:
  ros__parameters:
    money_detections_topic: /money/detections
    navigation_detections_topic: /navigation/detections
    face_detections_topic: /face/detections
    # Walk-mode tactile path guidance (spoken: ตรงไป/เลี้ยวซ้าย/เลี้ยวขวา/หยุด ตัดสินใจ).
    # Direction = majority vote over the last tactile_window_sec of frames
    # (tolerates per-frame flicker); spoken when the winning direction changes.
    # Obstacle warnings take priority and mute directions for tactile_obstacle_mute_sec.
    tactile_detections_topic: /tactile/path
    tactile_announce_enabled: true
    tactile_window_sec: 1.0
    tactile_min_samples: 5
    tactile_obstacle_mute_sec: 2.0
    # Hold a spoken direction at least this long before switching to a different
    # one (anti-flip-flop). Raise it if directions feel chatty; STOP ignores it.
    tactile_min_dwell_sec: 2.5
    face_repeat_sec: 5.0
    current_mode_topic: /oak/current_mode
    cooldown_sec: 2.0
    tts_enabled: true
    tts_command: edge-playback
    tts_voice_th: th-TH-PremwadeeNeural
    tts_voice_en: en-US-EmmaNeural
    announce_mode_changes: true
    announce_detections: true
    boot_greeting_enabled: true
    boot_greeting_th: "ระบบพร้อมใช้งาน โหมดเดิน"
    boot_greeting_en: "System ready. Walk mode."
    money_confirm_count: 10
    money_gap_sec: 3.0
    language_topic: /oak/language
    default_language: th
    announcement_topic: /oak/announcement
    undervoltage_check_enabled: true
    undervoltage_check_interval_sec: 10.0
    undervoltage_repeat_sec: 60.0
    undervoltage_th: "คำเตือน ไฟเลี้ยงต่ำ กรุณาตรวจสอบแบตเตอรี่"
    undervoltage_en: "Warning, low power supply. Please check the battery."
    # เตือนแบตต่ำตาม % ที่ web_display_node เผยแพร่มา (เกณฑ์เรียงมากไปน้อย)
    # พูดครั้งเดียวต่อเกณฑ์ เตือนซ้ำได้เมื่อชาร์จกลับขึ้นเกิน เกณฑ์ + rearm_margin
    battery_warn_enabled: true
    battery_percent_topic: /oak/battery_percent
    battery_warn_levels: [20, 15, 10]
    battery_warn_rearm_margin: 3
    battery_warn_th: "แบตเตอรี่เหลือ {pct} เปอร์เซ็นต์ กรุณาชาร์จ"
    battery_warn_en: "Battery low, {pct} percent remaining. Please charge."

web_display_node:
  ros__parameters:
    current_mode_topic: /oak/current_mode
    announcement_topic: /oak/announcement
    preview_topic: /oak/preview/compressed
    http_host: 0.0.0.0
    http_port: 8080
    # --- Battery monitor (ADS1115 on A0, 3S LiPo via 1.2k/0.67k divider) ---
    # The ADC reads the voltage across the 0.67k resistor. Full 3S = 12.6V ->
    # ~4.51V at the pin, so power the ADS1115 from 5V and keep the 6.144V range.
    battery_enable: true
    battery_i2c_bus: 1
    battery_i2c_addr: 0x48        # ADDR -> GND
    battery_channel: 0            # A0
    battery_fsr_volts: 6.144      # full-scale range (+/-6.144V); MUST be >= ~4.6V
    battery_r_top_ohms: 1200.0    # resistor from battery+ to the A0 node
    battery_r_bottom_ohms: 670.0  # resistor from A0 node to GND (measured across)
    battery_calibration: 1.010    # multiply if a multimeter disagrees: real/shown (11.2/11.41)
    battery_cells: 3              # 3S -> percent uses per-cell voltage
    battery_poll_sec: 5.0
    battery_percent_topic: /oak/battery_percent  # ส่ง % ให้ decision_audio_node เตือนแบตต่ำ

speech_logger_node:
  ros__parameters:
    language: th-TH
    backend: arecord
    mode_cmd_topic: /oak/mode_cmd
    language_topic: /oak/language
    default_language: th
    walk_phrase: "เดินต่อไป"
    money_phrase: "เช็คธนบัตร"
    face_phrase: "สวัสดี"
    # Muted: decision_audio_node is the single voice of the system (its speech
    # manager arbitrates everything). speech_logger only listens + publishes
    # mode/language commands, so it must not speak (would overlap). Mode changes
    # are still announced by decision_audio via /oak/current_mode.
    tts_enabled: false
    announce_matched_commands: false
    tts_command: edge-playback
    tts_voice_th: th-TH-PremwadeeNeural
    tts_voice_en: en-US-EmmaNeural
    device_index: -1
    arecord_device: default
    sample_rate_hz: 16000
    log_microphones: false
    suppress_alsa_errors: true
    listen_timeout_sec: 5.0
    phrase_time_limit_sec: 3.0
    arecord_chunk_sec: 3.0
    ambient_duration_sec: 1.0
    energy_threshold: 300
    pause_threshold_sec: 0.8
    min_rms_threshold: 140
    log_silence_skips: false
